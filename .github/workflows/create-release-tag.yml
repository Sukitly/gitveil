name: Create release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-release-tag
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag the merged release
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The dedicated fine-grained RELEASE_TOKEN (contents read/write on this
      # repository only) is required because tags pushed with GITHUB_TOKEN do
      # not trigger the tag-driven release workflow.
      - name: Check out the merge commit with the tagging credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read and validate the release version
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Cargo.toml version $version is not exact SemVer" >&2
            exit 1
          fi
          if [[ "$HEAD_BRANCH" != "release/v$version" ]]; then
            echo "the release/ branch prefix is reserved for scripts/prepare-release.py (see docs/releasing.md);" >&2
            echo "$HEAD_BRANCH does not match the Cargo version $version (expected release/v$version), so no tag was created" >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote origin "refs/tags/v$version")" ]]; then
            # An existing tag is only a safe no-op when it already points at
            # this merge commit (idempotent re-run); pointing anywhere else
            # means the version number is taken and needs a human.
            git fetch --quiet --no-tags origin "refs/tags/v$version:refs/tags/v$version"
            tagged="$(git rev-parse "v$version^{commit}")"
            if [[ "$tagged" == "$(git rev-parse HEAD)" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "tag v$version already points at this merge commit; nothing to do"
            else
              echo "tag v$version already exists and points at $tagged, not this merge commit;" >&2
              echo "the version number is taken: run scripts/prepare-release.py again to bump to the next version" >&2
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push the annotated tag
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Gitveil v$VERSION"
          git push origin "v$VERSION"
          echo "created tag v$VERSION at $(git rev-parse HEAD)"

      - name: Delete the merged release branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -n "$(git ls-remote --heads origin "$HEAD_BRANCH")" ]]; then
            git push origin --delete "$HEAD_BRANCH"
            echo "deleted branch $HEAD_BRANCH"
          else
            echo "branch $HEAD_BRANCH is already gone"
          fi
