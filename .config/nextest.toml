nextest-version = "0.9.140"

# Core tests are platform-independent library decisions and contract binaries.
# Tests under tests/ default to the host profile unless deliberately named contract_*.
[profile.ci-core]
fail-fast = false
default-filter = 'binary(/^contract_/) | (binary(gitveil) & not test(/^(configure::tests|git::repository::tests|identity::tests|manifest_document::tests|runtime::sidecar::tests)/))'

# Host tests are the exact complement of core tests and exercise external effects.
[profile.ci-host]
fail-fast = false
default-filter = 'not (binary(/^contract_/) | (binary(gitveil) & not test(/^(configure::tests|git::repository::tests|identity::tests|manifest_document::tests|runtime::sidecar::tests)/)))'

# Nextest runs every test in its own process, so serial_test's in-process
# lock does not serialize across tests here. This group preserves the same
# serialization the `#[serial]` markers provide under `cargo test`.
[test-groups]
ipc-endpoint = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(platform_runtime) & (test(authenticated_editor_ipc_transfers_payload_without_argv_or_filename_content) | test(editor_endpoint_rejects_a_second_connection) | test(editor_endpoint_fails_closed_on_a_wrong_token))'
test-group = 'ipc-endpoint'
