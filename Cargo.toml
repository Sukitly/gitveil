[package]
name = "gitveil"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Structured secret file encryption for Git repositories"
repository = "https://github.com/Sukitly/gitveil"
publish = false

[lib]
name = "gitveil"
path = "src/lib.rs"

[[bin]]
name = "gitveil"
path = "src/main.rs"

[dependencies]
base64 = "0.23.0"
bech32 = "0.12.0"
camino = { version = "1.2.4", features = ["serde1"] }
clap = { version = "4.6.4", features = ["derive", "env", "wrap_help"] }
hex = "0.4.3"
indexmap = { version = "2.14.0", features = ["serde"] }
interprocess = "2.4.2"
rand = "0.10.2"
semver = "1.0.28"
similar = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = { version = "1.1.3", features = ["preserve_order"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
unicode-normalization = "0.1.25"
wait-timeout = "0.2.1"
yaml-edit = { version = "0.2.3", default-features = false }
yaml_serde = "0.10.4"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
regex = "1.13.1"
serial_test = "4.0.1"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
# The library is an implementation detail of the binary and its contract tests;
# `pub` must mean "reachable from outside the crate" so that `dead_code` keeps
# covering everything else.
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
